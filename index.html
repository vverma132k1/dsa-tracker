<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DSA tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --bg:#F5F6F2; --grid:rgba(29,35,43,.05); --surface:#FFFFFF; --ink:#1D232B; --muted:#5D6874;
  --line:#D9DEE3; --track:#E1E5E9;
  --done:#16855A; --done-soft:#E0F2E8; --blue:#2350D8; --blue-soft:#E2E9FC;
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#15231F; --grid:rgba(238,241,232,.05); --surface:#1C2D28; --ink:#EEF1E8; --muted:#A2B3A9;
    --line:#2E453E; --track:#2B3F38;
    --done:#7FD9A6; --done-soft:#21382F; --blue:#8DB3FF; --blue-soft:#23324F;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#15231F; --grid:rgba(238,241,232,.05); --surface:#1C2D28; --ink:#EEF1E8; --muted:#A2B3A9;
  --line:#2E453E; --track:#2B3F38;
  --done:#7FD9A6; --done-soft:#21382F; --blue:#8DB3FF; --blue-soft:#23324F;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0; background-color:var(--bg); color:var(--ink);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:32px 32px;
  font-family:var(--f-body); font-size:16px; line-height:1.45; -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
.app{max-width:640px;margin:0 auto;padding:0 18px 72px}

.top{display:flex;justify-content:space-between;align-items:flex-end;padding:22px 0 10px}
.top h1{margin:0;font:700 28px/1.1 var(--f-display);letter-spacing:-.02em}
.top .date{margin:4px 0 0;color:var(--muted);font-size:14px}
.linkbtn{background:none;border:0;padding:10px 4px;color:var(--blue);font-weight:600;font-size:14px}
.linkbtn:hover{text-decoration:underline}

.tabs{display:flex;gap:8px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding:8px 0 10px;
  background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(6px)}
.tab{flex:1;height:44px;border-radius:12px;border:1.5px solid var(--line);background:transparent;font:600 15px var(--f-display)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

h2{font:700 18px/1.2 var(--f-display);letter-spacing:-.01em;margin:30px 0 10px}

/* hero ring */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:14px 0 4px}
.ring{position:relative;width:min(220px,62vw);aspect-ratio:1}
.ring svg{width:100%;height:100%;display:block}
.ring circle{transition:stroke .25s}
.ring-center{position:absolute;inset:0;display:grid;place-content:center}
.streak-n{font:700 clamp(52px,17vw,68px)/1 var(--f-display);letter-spacing:-.03em}
.streak-l{font-size:14px;color:var(--muted);margin-top:2px}
.hero-cap{margin:14px 0 2px;font:600 20px/1.2 var(--f-display)}
.hero-sub{margin:0;color:var(--muted);font-size:14px}

/* today's questions */
.qs{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.q{display:flex;align-items:flex-start;gap:6px}
.q.card{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:6px 8px 6px 4px;transition:background .2s,border-color .2s}
.q.card.done{background:var(--done-soft);border-color:transparent}
.q.row{padding:2px 0;border-top:1px solid var(--line)}
.check{flex:none;width:44px;height:44px;background:none;border:0;padding:0;display:grid;place-items:center}
.box{width:26px;height:26px;border-radius:8px;border:2px solid var(--muted);display:grid;place-items:center;transition:background .15s,border-color .15s}
.box svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.check[aria-pressed="true"] .box{background:var(--done);border-color:var(--done)}
.check[aria-pressed="true"] .box svg{opacity:1;stroke:var(--bg)}
.q-body{flex:1;min-width:0;padding:9px 0 9px}
.q-title{font-weight:600;display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.q.done .q-title{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1.5px}
.q.card.review{border-left:4px solid var(--blue)}
.q.card.review.done .q-title{text-decoration:none;color:var(--ink)}
.q-topic{font-size:13px;color:var(--ink);margin-top:1px}
.q-note{font-size:13px;color:var(--muted);margin-top:1px}
.ext{flex:none;width:40px;height:44px;display:grid;place-items:center;color:var(--blue);border-radius:10px}
.ext svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ext:hover{background:var(--blue-soft)}

/* stats */
.stat{margin-bottom:14px}
.stat-h{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
.stat-h b{font-family:var(--f-display);font-weight:700}
.bar{height:8px;border-radius:999px;background:var(--track);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--done);border-radius:inherit;transition:width .3s}

/* topics */
.tools{display:flex;justify-content:space-between;align-items:center;margin:26px 0 6px}
.tools h2{margin:0}
.chip{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.topic-head{width:100%;display:grid;grid-template-columns:1fr auto 20px;gap:4px 12px;align-items:center;text-align:left;
  background:none;border:0;border-bottom:1px solid var(--line);padding:16px 0 14px}
.topic-name{font:600 17px/1.25 var(--f-display)}
.topic-count{font:600 14px var(--f-display);color:var(--muted)}
.topic-head .bar{grid-column:1/-1;height:6px}
.chev{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.topic-head[aria-expanded="true"] .chev{transform:rotate(180deg)}
.topic-body{padding:10px 0 14px}
.blurb{margin:0 0 8px;font-size:14px;color:var(--muted)}
.topic-note{margin:10px 0 0;padding:10px 12px;border-radius:10px;background:var(--surface);border:1.5px dashed var(--line);font-size:13px;color:var(--muted)}
.extras{margin-top:28px}
.extras h2{margin-top:0}
.extras p{font-size:14px;color:var(--muted);margin:0}
.empty{padding:18px 0;color:var(--muted);font-size:14px}

/* modal */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:92%;overflow:auto;background:var(--surface);border-radius:18px 18px 0 0;
  padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));border:1.5px solid var(--line)}
.sheet h2{margin:0 0 6px}
.sheet p{margin:0 0 12px;font-size:14px;color:var(--muted)}
.sheet label{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
.sheet textarea{width:100%;height:96px;resize:vertical;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);
  padding:10px;font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.btn{height:42px;padding:0 16px;border-radius:10px;border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);font-weight:600;font-size:14px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.msg{min-height:20px;font-size:13px;margin-top:10px;color:var(--muted)}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <h1>DSA tracker</h1>
      <p class="date" id="date"></p>
    </div>
    <button class="linkbtn" data-act="backup">Backup</button>
  </header>
  <nav class="tabs" role="tablist" aria-label="Pages">
    <button class="tab" role="tab" data-act="tab" data-tab="today" id="tab-today">Today</button>
    <button class="tab" role="tab" data-act="tab" data-tab="topics" id="tab-topics">Topics</button>
  </nav>
  <main id="view"></main>
</div>
<div class="scrim" id="modal" hidden></div>

var DAILY = 4;
var STORE_KEY = 'dsa-tracker-v1';

/* ---------- question bank ---------- */
var TOPICS = DATA.topics, BYKEY = {}, UNIQUE = [];
TOPICS.forEach(function(t){
  t.items.forEach(function(it){
    if(!BYKEY[it.key]){ BYKEY[it.key] = {key:it.key,name:it.name,note:it.note,topic:t.id}; UNIQUE.push(BYKEY[it.key]); }
  });
});

/* ---------- helpers ---------- */
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function pad(n){ return String(n).padStart(2,'0'); }
function fmt(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parseD(s){ var p=s.split('-').map(Number); return new Date(p[0],p[1]-1,p[2]); }
function addDays(s,n){ var d=parseD(s); d.setDate(d.getDate()+n); return fmt(d); }
function todayStr(){ return fmt(new Date()); }
var DATE_RE = /^\d{4}-\d{2}-\d{2}$/;

/* ---------- state ---------- */
/* solved[key] = the date (YYYY-MM-DD) it was ticked, or null if that date is unknown
   (only happens for progress migrated from an older version of this tracker). */
function emptyState(){ return {v:2,solved:{},reviews:{},updatedAt:0}; }
function migrateFromDays(o){
  var solved={};
  if(o.days && typeof o.days==='object'){
    Object.keys(o.days).forEach(function(d){
      if(!DATE_RE.test(d)) return;
      var r=o.days[d]; if(!r || !Array.isArray(r.done)) return;
      r.done.forEach(function(k){ if(BYKEY[k]) solved[k]=d; });
    });
  }
  if(o.solved && typeof o.solved==='object'){
    Object.keys(o.solved).forEach(function(k){
      if(!BYKEY[k] || solved[k]) return;
      var v=o.solved[k];
      solved[k]= (typeof v==='string' && DATE_RE.test(v)) ? v : null;
    });
  }
  return solved;
}
function sanitize(o){
  if(!o || typeof o!=='object') return null;
  var s=emptyState(), src, k;
  src = o.days ? migrateFromDays(o) : (o.solved && typeof o.solved==='object' ? o.solved : {});
  for(k in src){
    if(!BYKEY[k]) continue;
    var v=src[k];
    s.solved[k]= (typeof v==='string' && DATE_RE.test(v)) ? v : null;
  }
  if(o.reviews && typeof o.reviews==='object'){
    for(var w in o.reviews){
      if(!DATE_RE.test(w)) continue;
      var rv=o.reviews[w]; if(!rv || !Array.isArray(rv.ids)) continue;
      var rids=rv.ids.filter(function(x){return BYKEY[x];});
      var rdone=(Array.isArray(rv.done)?rv.done:[]).filter(function(x){return rids.indexOf(x)>-1;});
      s.reviews[w]={ids:rids,done:rdone};
    }
  }
  s.updatedAt = Number(o.updatedAt)||0;
  return s;
}
function loadLocal(){
  try{ var raw=localStorage.getItem(STORE_KEY); if(raw){ var s=sanitize(JSON.parse(raw)); if(s) return s; } }catch(e){}
  return emptyState();
}
var state = loadLocal();
function persistLocal(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){} }
function save(){ state.updatedAt=Date.now(); persistLocal(); schedulePush(); }

/* ---------- to-do list: the next unsolved questions in sheet order ---------- */
function toDo(n){
  var out=[];
  for(var i=0;i<UNIQUE.length && out.length<n;i++){
    if(!(UNIQUE[i].key in state.solved)) out.push(UNIQUE[i].key);
  }
  return out;
}
function weekStart(dstr){ var dow=(parseD(dstr).getDay()+6)%7; return addDays(dstr,-dow); }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
/* The review week is the Mon-Sun week that ends on the most recent Sunday (today, if today is Sunday). */
function reviewWeek(dstr){
  var dow=(parseD(dstr).getDay()+6)%7, ws=weekStart(dstr);
  return dow===6 ? ws : addDays(ws,-7);
}
function ensureReview(){
  var pw=reviewWeek(todayStr()), cur=state.reviews[pw];
  if(cur && cur.ids.length) return;
  var pweek=addDays(pw,6), pool=[];
  for(var k in state.solved){
    var v=state.solved[k];
    if(v && v>=pw && v<=pweek) pool.push(k);
  }
  if(!pool.length && cur) return;
  state.reviews[pw]={ids:shuffle(pool).slice(0,4),done:[]};
  save();
}
function setSolved(key,on){
  if(on) state.solved[key]=todayStr();
  else delete state.solved[key];
  save();
}

/* ---------- streak: any day with at least one question solved counts.
   Recomputed from history every time, so the best streak is always accurate. ---------- */
function computeStreak(){
  var byDay={}, k, v;
  for(k in state.solved){ v=state.solved[k]; if(v) byDay[v]=true; }
  var dates=Object.keys(byDay).sort(), best=0, run=0, prev=null;
  dates.forEach(function(ds){
    run = (prev && addDays(prev,1)===ds) ? run+1 : 1;
    if(run>best) best=run;
    prev=ds;
  });
  var today=todayStr(), todayDone=!!byDay[today];
  var cur=0, d=todayDone?today:addDays(today,-1);
  while(byDay[d]){ cur++; d=addDays(d,-1); }
  if(cur>best) best=cur;
  return {streak:cur, best:best, todayDone:todayDone};
}

}

function ringSVG(on){

    '<circle cx="100" cy="100" r="'+R+'" fill="none" stroke="'+(on?'var(--done)':'var(--track)')+'" stroke-width="'+sw+'"/></svg>';
}

function renderToday(){
  var t=todayStr(), ids=toDo(DAILY), S=computeStreak();
  var h='<section class="hero"><div class="ring">'+ringSVG(S.todayDone)+
    '<div class="ring-center"><span class="streak-n">'+S.streak+'</span><span class="streak-l">day streak</span></div></div>';
  var cap = S.todayDone ? 'Today counts. Keep it going.'
    : (S.streak>0 ? 'Solve one question today to make it '+(S.streak+1)+'.' : 'Solve one question today to start a streak.');
  h+='<p class="hero-cap">'+cap+'</p>';
  h+='<p class="hero-sub">Best streak: '+S.best+' day'+(S.best===1?'':'s')+'</p></section>';

  h+='<h2>To do</h2>';
  if(ids.length){
    h+='<ol class="qs">';
    ids.forEach(function(k){
      var p=BYKEY[k];
      h+='<li class="q card">'+checkBtn(k,false,'todo',p.name)+
        '<div class="q-body"><div class="q-title"><span>'+esc(p.name)+'</span></div>'+
        '<div class="q-topic">'+esc(TOPICS[p.topic].name)+'</div>'+
        (p.note?'<div class="q-note">'+esc(p.note)+'</div>':'')+'</div>'+extLink(p.name)+'</li>';
    });
    h+='</ol>';
  }else{
    h+='<p class="empty">You have solved every question on the list.</p>';
  }

  var pw=reviewWeek(t), rv=state.reviews[pw];
  h+='<h2>Weekly review</h2>';
  if(rv && rv.ids.length){
    var lo={day:'numeric',month:'short'};
    h+='<p class="blurb">Questions from '+parseD(pw).toLocaleDateString(undefined,lo)+' to '+parseD(addDays(pw,6)).toLocaleDateString(undefined,lo)+
      '. Try to recall the approach and code it before you look anything up, then tick the ones you remember.</p><ol class="qs">';
    rv.ids.forEach(function(k){
      var p=BYKEY[k], on=rv.done.indexOf(k)>-1;
      h+='<li class="q card review'+(on?' done':'')+'">'+checkBtn(k,on,'review',p.name,'review',pw)+
        '<div class="q-body"><div class="q-title"><span>'+esc(p.name)+'</span></div><div class="q-topic">'+esc(TOPICS[p.topic].name)+'</div></div>'+extLink(p.name)+'</li>';
    });
    h+='</ol>';
  }else{
    h+='<p class="empty">No questions to review yet. Every Sunday, 4 random questions you solved that week will show up here so you can check you still remember them.</p>';
  }
  var total=UNIQUE.length, solved=UNIQUE.filter(function(p){return state.solved[p.key];}).length;
  h+='<h2>Overall</h2>'+
    '<div class="stat"><div class="stat-h"><span>Questions solved</span><b>'+solved+' / '+total+'</b></div><div class="bar"><i style="width:'+(100*solved/total)+'%"></i></div></div>';
  return h;
}

function renderTopics(){
  var total=UNIQUE.length, solved=UNIQUE.filter(function(p){return state.solved[p.key];}).length;
  var h='<div class="tools"><h2>'+solved+' of '+total+' solved</h2><button class="chip" data-act="hide" aria-pressed="'+ui.hideSolved+'">Hide solved</button></div>';
  TOPICS.forEach(function(t){
    var s=t.items.filter(function(i){return state.solved[i.key];}).length, open=!!ui.open[t.id];
    h+='<section class="topic"><button class="topic-head" data-act="topic" data-t="'+t.id+'" aria-expanded="'+open+'">'+
      '<span class="topic-name">'+esc(t.name)+'</span><span class="topic-count">'+s+' / '+t.items.length+'</span>'+ICON_CHEV+
      '<span class="bar"><i style="width:'+(100*s/t.items.length)+'%"></i></span></button>';
    if(open){
      h+='<div class="topic-body">'+(t.blurb?'<p class="blurb">'+esc(t.blurb)+'</p>':'');
      var rows=t.items.filter(function(i){return !(ui.hideSolved && state.solved[i.key]);});
      if(!rows.length) h+='<p class="empty">Everything here is solved.</p>';
      else{
        h+='<ul class="qs" style="gap:0">';
        rows.forEach(function(i){
          var on=!!state.solved[i.key];
          h+='<li class="q row'+(on?' done':'')+'">'+checkBtn(i.key,on,'t'+t.id,i.name)+
            '<div class="q-body"><div class="q-title"><span>'+esc(i.name)+'</span></div>'+
            (i.note?'<div class="q-note">'+esc(i.note)+'</div>':'')+'</div>'+extLink(i.name)+'</li>';
        });
        h+='</ul>';
      }
      if(t.note) h+='<p class="topic-note">'+esc(t.note)+'</p>';
      h+='</div>';
    }
    h+='</section>';
  });
  if(DATA.footer) h+='<aside class="extras"><h2>Optional extras</h2><p>'+esc(DATA.footer)+'</p></aside>';
  return h;
}

var viewEl=document.getElementById('view');
function render(focusSel){
  ensureReview();
  renderedDate=todayStr();
  document.getElementById('date').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'short'});
  ['today','topics'].forEach(function(n){
    var b=document.getElementById('tab-'+n); b.setAttribute('aria-selected', ui.tab===n?'true':'false');
  });
  viewEl.innerHTML = ui.tab==='today' ? renderToday() : renderTopics();
  if(focusSel){ var el=document.querySelector(focusSel); if(el) el.focus({preventScroll:true}); }
}

/* ---------- backup modal ---------- */
var modalEl=document.getElementById('modal'), lastFocus=null, downloadsCap=null;
var syncStatus='local';
function syncLine(){
  return syncStatus==='synced'
    ? 'Your progress is synced to your Claude account, so other devices you open this on will pick it up.'
    : 'Your progress is saved in this browser only. Use a backup to move it to another device.';
}
function openModal(){
  lastFocus=document.activeElement;
  modalEl.innerHTML='<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mh">'+
    '<h2 id="mh">Backup and restore</h2><p>'+syncLine()+'</p>'+
    '<label for="exportBox">Your backup</label><textarea id="exportBox" readonly></textarea>'+
    '<div class="btns"><button class="btn" data-act="copy">Copy backup</button>'+
    (downloadsCap?'<button class="btn ghost" data-act="savefile">Save as file</button>':'')+'</div>'+
    '<label for="importBox">Restore from a backup</label><textarea id="importBox" placeholder="Paste a backup here"></textarea>'+
    '<div class="btns"><button class="btn" data-act="restore">Restore</button><button class="btn ghost" data-act="close">Close</button></div>'+
    '<p class="msg" id="bmsg" role="status" aria-live="polite"></p></div>';
  modalEl.hidden=false;
  document.getElementById('exportBox').value=JSON.stringify(state);
  var c=modalEl.querySelector('[data-act="close"]'); if(c) c.focus();
}
function closeModal(){ modalEl.hidden=true; modalEl.innerHTML=''; if(lastFocus&&lastFocus.focus) lastFocus.focus(); }
function say(m){ var e=document.getElementById('bmsg'); if(e) e.textContent=m; }

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  if(e.target===modalEl){ closeModal(); return; }
  var el=e.target.closest('[data-act]'); if(!el) return;
  var act=el.getAttribute('data-act');
  if(act==='tab'){ ui.tab=el.getAttribute('data-tab'); render(); window.scrollTo(0,0); }
  else if(act==='toggle'){
    var k=el.getAttribute('data-k'), src=el.getAttribute('data-src');
    setSolved(k, el.getAttribute('aria-pressed')!=='true');
    render('[data-act="toggle"][data-src="'+src+'"][data-k="'+CSS.escape(k)+'"]');
  }
  else if(act==='review'){
    var w=el.getAttribute('data-w'), rk=el.getAttribute('data-k'), rv=state.reviews[w];
    if(rv){
      var ix=rv.done.indexOf(rk);
      if(ix>-1) rv.done.splice(ix,1); else rv.done.push(rk);
      save(); render('[data-act="review"][data-k="'+CSS.escape(rk)+'"]');
    }
  }
  else if(act==='topic'){
    var id=el.getAttribute('data-t'); ui.open[id]=!ui.open[id]; render('[data-act="topic"][data-t="'+id+'"]');
  }
  else if(act==='hide'){ ui.hideSolved=!ui.hideSolved; render('[data-act="hide"]'); }
  else if(act==='backup'){ openModal(); }
  else if(act==='close'){ closeModal(); }
  else if(act==='copy'){
    var box=document.getElementById('exportBox'), text=box.value;
    (navigator.clipboard&&navigator.clipboard.writeText ? navigator.clipboard.writeText(text) : Promise.reject()).then(
      function(){ say('Backup copied.'); },
      function(){ box.focus(); box.select(); var ok=false; try{ ok=document.execCommand('copy'); }catch(_){} say(ok?'Backup copied.':'Select the text above and copy it.'); }
    );
  }
  else if(act==='savefile'){
    downloadsCap.save({filename:'dsa-tracker-backup.json',data:JSON.stringify(state)}).then(
      function(){ say('Saved.'); },
      function(err){ say(err&&err.code==='declined' ? 'Save cancelled.' : 'Could not save a file here. Use Copy backup instead.'); }
    );
  }
  else if(act==='restore'){
    var raw=document.getElementById('importBox').value.trim();
    if(!raw){ say('Paste a backup first.'); return; }
    var parsed=null; try{ parsed=sanitize(JSON.parse(raw)); }catch(_){}
    if(!parsed || !Object.keys(parsed.solved).length){ say('That does not look like a backup from this tracker.'); return; }
    state=parsed; save(); render();
    document.getElementById('exportBox').value=JSON.stringify(state);
    say('Restored. '+Object.keys(state.solved).length+' solved questions loaded.');
  }
});
document.addEventListener('keydown',function(e){ if(e.key==='Escape' && !modalEl.hidden) closeModal(); });

/* ---------- day rollover ---------- */
function checkRollover(){ if(todayStr()!==renderedDate && modalEl.hidden) render(); }
setInterval(checkRollover,60000);

/* ---------- optional account sync (progressive; the app works without it) ---------- */
var dbDoc=null, pushTimer=null, pushing=false, pushAgain=false, pulling=false;
function schedulePush(){ if(!dbDoc) return; clearTimeout(pushTimer); pushTimer=setTimeout(doPush,800); }
function doPush(){
  if(!dbDoc) return;
  if(pushing){ pushAgain=true; return; }
  pushing=true;
  dbDoc.set(JSON.parse(JSON.stringify(state))).then(function(){ syncStatus='synced'; },function(){ syncStatus='local'; }).then(function(){
    pushing=false; if(pushAgain){ pushAgain=false; schedulePush(); }
  });
}
function pull(){
  if(!dbDoc || pulling) return;
  pulling=true;
  dbDoc.get().then(function(snap){
    syncStatus='synced';
    if(snap.exists){
      var remote=sanitize(snap.data());
      if(remote && remote.updatedAt>state.updatedAt){ state=remote; persistLocal(); if(modalEl.hidden) render(); }
      else if(remote && remote.updatedAt<state.updatedAt){ schedulePush(); }
    }else if(Object.keys(state.solved).length){ schedulePush(); }
  }).catch(function(){ syncStatus='local'; }).then(function(){ pulling=false; });
}
function initCaps(){
  if(!window.claude || !window.claude.use) return;
  window.claude.use('downloads').then(function(d){ downloadsCap=d; }).catch(function(){});
  Promise.all([window.claude.use('db'), window.claude.use('user')]).then(function(r){
    var db=r[0], user=r[1]; if(!db||!user) return null;
    return user.id().then(function(uid){
      if(!uid) return;
      dbDoc=db.doc('data/users/'+uid+'/tracker');
      pull();
    });
  }).catch(function(){});
}
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='visible'){ checkRollover(); pull(); }
});

render();
initCaps();
})();
</script>
</body>
